    <div class="container-fluid bg-primary d-flex align-items-center justify-content-center" style="height: 100vh; flex-direction:column; gap:10px;">
        <h1 class="text-white">Signup Form</h1>
        <form class="p-5 border-rounded" style="width: 50vw; height: fit-content; background-color: white;">
            <div class="form-group mb-3">
                <label class="mb-1" for="">Name</label>
                <input type="text"
                  class="form-control" name="" id="name" aria-describedby="helpId" placeholder="Enter Name">
                <small id="name-error" class="form-text text-danger">Name Must Be Entered</small>
              </div>
            <div class="form-group mb-3">
              <label class="mb-1" for="">Email</label>
              <input type="text"
                class="form-control" name="" id="signup-email" aria-describedby="helpId" placeholder="Enter Email">
              <small id="email-error" class="form-text text-danger">Email Must Be Entered</small>
            </div>
            <div class="form-group mb-3">
                <label for="" class="mb-1">Password</label>
                <input type="password"
                  class="form-control" name="" id="signup-password" aria-describedby="helpId" placeholder="Enter Password">
                <small id="password-error" class="form-text text-danger">Password Must Be Entered</small>
              </div>

                <label for="" class="mb-1">Confirm Password</label>

                <small id="c-password-error" class="form-text text-danger">Password Not Macthed</small>
              </div> -->
              <div class="row">
                <button type="button" name="" id="submitBtn" class="btn btn-primary col-lg-6 col-xl-6 col-md-6 col-sm-12" btn-lg btn-block">Create Acoount</button>
                <a href="login.html" class="col-lg-6 col-xl-6 col-md-6 col-sm-12" style="text-align: end;">already have an account</a>
              </div>
        </form>
    </div>
